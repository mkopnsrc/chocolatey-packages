name: Backfill missing package versions

# Iterates over packages with a backfill.json manifest, queries chocolatey.org
# for which versions are already published + their moderation status, and
# pushes the next missing version per package — but only if the previously
# pushed version is Approved (not Pending/Submitted/Rejected). Each cron
# tick advances each package by at most one version, so the moderation queue
# is the implicit gate.
#
# Required repo secrets:
#   CHOCO_API_KEY  - chocolatey.org community feed API key (inherited by called workflow)

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6h
  workflow_dispatch:
    inputs:
      filter_package:
        description: 'Limit to a specific package (default: all packages with backfill.json)'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Plan only — do not push'
        type: boolean
        required: false
        default: false

jobs:
  plan:
    name: Compute backfill plan
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.compute.outputs.plan }}
      has_work: ${{ steps.compute.outputs.has_work }}
    steps:
      - uses: actions/checkout@v5

      - name: Compute next-version per package
        id: compute
        shell: pwsh
        env:
          FILTER: ${{ inputs.filter_package }}
        run: |
          $manifests = Get-ChildItem automatic/*/backfill.json -ErrorAction SilentlyContinue
          if (-not $manifests) {
            Write-Host "No backfill.json manifests found under automatic/*/"
            "plan=[]" >> $env:GITHUB_OUTPUT
            "has_work=false" >> $env:GITHUB_OUTPUT
            return
          }

          $plan = @()
          foreach ($mf in $manifests) {
            $pkg = Split-Path -Leaf (Split-Path $mf.FullName)
            if ($env:FILTER -and $env:FILTER -ne $pkg) { continue }

            try {
              $targets = (Get-Content $mf.FullName -Raw | ConvertFrom-Json).versions
            } catch {
              Write-Host "::warning::$pkg : invalid backfill.json ($_); skipping"
              continue
            }
            if (-not $targets) {
              Write-Host "$pkg : empty versions list; skipping"
              continue
            }

            # CCR's OData feed (every variant of it — direct-key, FindPackagesById,
            # $filter on Id+Version) returns stale "Approved/IsApproved=true" data
            # from at least the Azure runner's network edge for packages that
            # are still in moderation. Empirical: querying the same URL from a
            # local Linux machine returns Submitted/IsApproved=false; from the
            # GitHub-hosted runner it returns Approved/IsApproved=true. There is
            # no version of the OData feed we can rely on across networks.
            #
            # The public HTML detail page at /packages/<id>/<version> is
            # consistent across networks and clearly marks moderation state.
            # CCR uses two distinct approval messages — both indicate Approved:
            #   "This package was approved as a trusted package..." (auto, trusted maintainer)
            #   "This package was approved by moderator <name>..."  (human review)
            # Pending versions contain neither. Rejected versions contain
            # "rejected by" near "moderator".
            function Get-CcrApprovalState($pkg, $version) {
              $url = "https://community.chocolatey.org/packages/$pkg/$version"
              try {
                $resp = Invoke-WebRequest -Uri $url -UseBasicParsing -UserAgent 'mkopnsrc-backfill/1.0'
                $html = $resp.Content
                if ($html -match 'This package was approved (as|by moderator)') { return 'Approved' }
                if ($html -match 'rejected by .{0,40}moderator') { return 'Rejected' }
                # Page exists, no approved/rejected marker → still in queue
                return 'Pending'
              } catch {
                if ($_.Exception.Response.StatusCode.value__ -eq 404 -or $_.Exception.Message -match '404') {
                  return $null
                }
                throw
              }
            }

            $statuses = [ordered]@{}
            foreach ($v in $targets) {
              try {
                $statuses[$v] = Get-CcrApprovalState $pkg $v
              } catch {
                Write-Host "::warning::$pkg : CCR check for $v failed ($_); treating as Unknown"
                $statuses[$v] = 'Unknown'
              }
            }

            $statusSummary = ($statuses.GetEnumerator() | ForEach-Object {
              '{0}={1}' -f $_.Key, ($_.Value ?? 'NotPushed')
            }) -join ', '
            Write-Host "$pkg : $statusSummary"

            # Find highest target already pushed (any non-null status).
            $pushedTargets = $targets | Where-Object { $null -ne $statuses[$_] }
            $highestPushed = if ($pushedTargets) { $pushedTargets | Select-Object -Last 1 } else { $null }

            if ($highestPushed) {
              $latestStatus = $statuses[$highestPushed]
              if ($latestStatus -in @('Pending', 'Unknown')) {
                Write-Host "::notice::$pkg : highest pushed version $highestPushed is $latestStatus — skipping this cycle"
                continue
              }
              if ($latestStatus -eq 'Rejected') {
                Write-Host "::error::$pkg : highest pushed version $highestPushed was Rejected — manual intervention needed"
                continue
              }
              # Approved → fall through to find next missing
            }

            $next = $targets | Where-Object { $null -eq $statuses[$_] } | Select-Object -First 1
            if ($next) {
              Write-Host "::notice::$pkg : queueing push for version $next"
              $plan += [pscustomobject]@{ package = $pkg; version = $next }
            } else {
              Write-Host "$pkg : caught up (all backfill targets present in CCR)"
            }
          }

          $json = if ($plan) { ConvertTo-Json -InputObject @($plan) -Compress } else { '[]' }
          "plan=$json" >> $env:GITHUB_OUTPUT
          "has_work=$($plan.Count -gt 0)" >> $env:GITHUB_OUTPUT
          Write-Host "---"
          Write-Host "Plan: $json"

  push:
    name: "Push ${{ matrix.target.package }} ${{ matrix.target.version }}"
    needs: plan
    if: needs.plan.outputs.has_work == 'True' && inputs.dry_run != true
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.plan.outputs.plan) }}
    uses: ./.github/workflows/package-build-test.yml
    with:
      package: ${{ matrix.target.package }}
      run_au: true
      publish: true
      force_version: ${{ matrix.target.version }}
    secrets: inherit

  commit-pr:
    name: Open aggregated PR with bumped package files
    needs: push
    if: ${{ always() && needs.plan.outputs.has_work == 'True' && inputs.dry_run != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - name: Download all bumped-package artifacts from this run
        uses: actions/download-artifact@v5
        with:
          path: /tmp/pkgfiles
          pattern: pkgfiles-*
        continue-on-error: true

      - name: Apply artifacts to working tree
        shell: pwsh
        run: |
          if (-not (Test-Path '/tmp/pkgfiles')) {
            Write-Host "No pkgfiles-* artifacts present — nothing to commit"
            "APPLIED_COUNT=0" >> $env:GITHUB_ENV
            return
          }
          $applied = @()
          foreach ($dir in (Get-ChildItem '/tmp/pkgfiles' -Directory)) {
            if ($dir.Name -match '^pkgfiles-(.+?)-([\d.]+)$') {
              $pkg = $matches[1]
              $version = $matches[2]
              $dst = "automatic/$pkg"
              if (-not (Test-Path $dst)) {
                Write-Host "::warning::Destination $dst does not exist; skipping $($dir.Name)"
                continue
              }
              Write-Host "Applying $($dir.Name) -> $dst"
              Copy-Item -Recurse -Force "$($dir.FullName)/*" "$dst/"
              $applied += "$pkg=$version"
            } else {
              Write-Host "::warning::Unexpected artifact name: $($dir.Name)"
            }
          }
          "APPLIED_COUNT=$($applied.Count)" >> $env:GITHUB_ENV
          "APPLIED_LIST=$($applied -join '|')" >> $env:GITHUB_ENV
          Write-Host "Applied: $($applied -join ', ')"

      - name: Commit and open PR
        if: env.APPLIED_COUNT != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          DATE=$(date -u +%Y-%m-%d-%H%M)
          BRANCH="bot/backfill-${DATE}"
          git checkout -b "$BRANCH"
          git add automatic/
          if git diff --cached --quiet; then
            echo "No changes to commit (artifacts applied but no diff vs master)"
            exit 0
          fi
          # Build PR body bullet list from APPLIED_LIST (pipe-separated pkg=version)
          BODY_LINES=""
          IFS='|' read -ra ITEMS <<< "$APPLIED_LIST"
          for item in "${ITEMS[@]}"; do
            BODY_LINES="${BODY_LINES}- \`${item%%=*}\` -> \`${item##*=}\`"$'\n'
          done
          TITLE="automated: backfill ${DATE} (${APPLIED_COUNT} packages)"
          BODY="The packages below were pushed to chocolatey.org during this backfill cycle. This PR keeps the repo files in sync with what was published.

          Bumped:
          ${BODY_LINES}
          Each push was install-tested on a fresh \`windows-2022\` runner and submitted to chocolatey.org's moderation queue. Merging this PR has no further publishing side-effect.
          "
          git commit -m "${TITLE}"
          git push origin "$BRANCH"
          gh pr create \
            --base master \
            --head "$BRANCH" \
            --assignee mkopnsrc \
            --title "${TITLE}" \
            --body "${BODY}"
