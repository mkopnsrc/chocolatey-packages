name: Build, Test, and Push Package

# Reusable workflow for building one Chocolatey package, installing it on a
# fresh Windows runner, verifying the install, uninstalling, and (optionally)
# pushing to community.chocolatey.org. Triggered manually via workflow_dispatch
# or programmatically by other workflows (e.g. backfill.yml) via workflow_call.
#
# Required repo secrets when `publish: true`:
#   CHOCO_API_KEY  - chocolatey.org community feed API key

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package directory under automatic/ (e.g. meshcommander)'
        required: true
        type: string
        default: 'meshcommander'
      run_au:
        description: 'Run update.ps1 first to refresh URL/checksum from vendor'
        type: boolean
        required: true
        default: true
      publish:
        description: 'Push to chocolatey.org after a successful test'
        type: boolean
        required: true
        default: false
      force_version:
        description: 'Force a specific version (sets $global:au_Version). Empty = latest from vendor.'
        type: string
        required: false
        default: ''
      force:
        description: 'Force re-publish: sets $global:au_Force=true so AU bumps the version to chocolatey fix notation (X.Y.Z.YYYYMMDD) and re-pushes. Use only when a previously-pushed version needs to be republished with corrected content.'
        type: boolean
        required: false
        default: false
      skip_install_test:
        description: 'Skip the local install / verify / uninstall steps. Use for packages whose installer takes longer than the workflow timeout (e.g. refinitiv-workspace). Pack and push still happen normally; chocolatey-side moderation will validate the install.'
        type: boolean
        required: false
        default: false

  workflow_call:
    inputs:
      package:
        required: true
        type: string
      run_au:
        required: true
        type: boolean
      publish:
        required: true
        type: boolean
      force_version:
        required: false
        type: string
        default: ''
      force:
        required: false
        type: boolean
        default: false
      skip_install_test:
        required: false
        type: boolean
        default: false
    secrets:
      CHOCO_API_KEY:
        required: false

jobs:
  build-test-push:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      PACKAGE: ${{ inputs.package }}
      FORCE_VERSION: ${{ inputs.force_version }}
      AU_FORCE: ${{ inputs.force }}

    steps:
      - uses: actions/checkout@v5

      - name: Validate package directory exists
        run: |
          $dir = "automatic/$env:PACKAGE"
          if (-not (Test-Path $dir)) { throw "Package directory not found: $dir" }
          Write-Host "Building package from $dir"
          if ($env:FORCE_VERSION) { Write-Host "Forcing version: $env:FORCE_VERSION" }
          if ($env:AU_FORCE -eq 'true') { Write-Host "Force-republish ENABLED — AU will use chocolatey fix notation (X.Y.Z.YYYYMMDD)" }

      - name: Install AU module to PSModulePath
        run: |
          & "$env:GITHUB_WORKSPACE\install.ps1" -module_path "$env:GITHUB_WORKSPACE\AU"

      - name: Run AU update.ps1 (refresh URL/checksum from vendor)
        if: ${{ inputs.run_au }}
        working-directory: automatic/${{ inputs.package }}
        run: |
          if ($env:FORCE_VERSION) {
            $global:au_Version = $env:FORCE_VERSION
            Write-Host "Forcing au_Version: $global:au_Version"
          }
          if ($env:AU_FORCE -eq 'true') {
            $global:au_Force = $true
            Write-Host "Forcing au_Force: \$true (will bump to fix notation if version already on CCR)"
          }
          ./update.ps1

      - name: Pack
        working-directory: automatic/${{ inputs.package }}
        run: |
          [xml]$nuspec = Get-Content "$env:PACKAGE.nuspec"
          $version = $nuspec.package.metadata.version
          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Version: $version"
          choco pack --out $env:RUNNER_TEMP
          Get-ChildItem $env:RUNNER_TEMP\*.nupkg | ForEach-Object {
            Write-Host "Built: $($_.Name) ($([math]::Round($_.Length/1KB,1)) KB)"
          }

      - name: Install package from local source
        if: ${{ !inputs.skip_install_test }}
        run: |
          choco install $env:PACKAGE `
            --source "$env:RUNNER_TEMP;https://community.chocolatey.org/api/v2/" `
            --confirm --no-progress

      - name: Verify install via chocolatey local list
        if: ${{ !inputs.skip_install_test }}
        run: |
          # chocolatey's own list is the authoritative "did the package install"
          # check. Registry lookup by package id is unreliable — installers
          # often register a DisplayName that doesn't textually contain the
          # chocolatey id (e.g. pgptool → "PGP Tool", poly-lens → "Poly Lens").
          $listing = choco list $env:PACKAGE --exact 2>&1 | Out-String
          if ($listing -notmatch "(?m)^$([regex]::Escape($env:PACKAGE))\s") {
            Write-Host "choco list output:`n$listing"
            throw "$env:PACKAGE not in chocolatey local list after install"
          }
          Write-Host "Confirmed installed via chocolatey:"
          Write-Host $listing

      - name: Uninstall
        if: ${{ !inputs.skip_install_test }}
        run: choco uninstall $env:PACKAGE --confirm --no-progress

      - name: Push to chocolatey.org community feed
        if: ${{ inputs.publish }}
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          if (-not $env:CHOCO_API_KEY) { throw 'CHOCO_API_KEY repo secret is not set' }
          $nupkg = (Get-ChildItem $env:RUNNER_TEMP\*.nupkg | Select-Object -First 1).FullName
          choco apikey --key $env:CHOCO_API_KEY --source 'https://push.chocolatey.org/'
          choco push $nupkg --source 'https://push.chocolatey.org/' --timeout 300

      - name: Upload nupkg artifact
        if: always() && env.PACKAGE_VERSION != ''
        uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.package }}-${{ env.PACKAGE_VERSION }}-nupkg
          path: ${{ runner.temp }}/*.nupkg
          retention-days: 14

      - name: Upload modified package files (consumed by backfill commit-pr)
        if: ${{ inputs.publish && success() && env.PACKAGE_VERSION != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: pkgfiles-${{ inputs.package }}-${{ env.PACKAGE_VERSION }}
          path: automatic/${{ inputs.package }}/
          retention-days: 1
