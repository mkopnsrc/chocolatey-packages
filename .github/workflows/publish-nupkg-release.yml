name: Publish nupkg to GitHub Releases

# For packages that embed their binary and are distributed via GitHub Releases
# (this repo's own release page) rather than community.chocolatey.org.
#
# The workflow: runs update.ps1 (which downloads the vendor binary and embeds
# it under tools/), packs the .nupkg, optionally smoke-tests install/uninstall
# on the runner, and — if publish_release is true — creates or updates a
# GitHub Release tagged `<package>-v<version>` with the .nupkg attached.
#
# End users consume the resulting package with:
#   choco install <package> -s https://github.com/mkopnsrc/chocolatey-packages/releases/download/<package>-v<version>/
# or by downloading the .nupkg and running `choco install <package> -s .`.

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package directory under automatic/ (e.g. fluent-bit)'
        required: true
        type: string
        default: 'fluent-bit'
      run_au:
        description: 'Run update.ps1 first (downloads the vendor binary + refreshes version/SHA)'
        type: boolean
        required: true
        default: true
      publish_release:
        description: 'Create/update a GitHub Release with the .nupkg attached'
        type: boolean
        required: true
        default: false
      force_version:
        description: 'Force a specific version (sets $global:au_Version). Empty = latest from vendor.'
        type: string
        required: false
        default: ''
      skip_install_test:
        description: 'Skip the local install / verify / uninstall smoke test on the runner.'
        type: boolean
        required: false
        default: false

jobs:
  pack-and-release:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      PACKAGE: ${{ inputs.package }}
      FORCE_VERSION: ${{ inputs.force_version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - name: Validate package directory exists
        run: |
          $dir = "automatic/$env:PACKAGE"
          if (-not (Test-Path $dir)) { throw "Package directory not found: $dir" }
          Write-Host "Building package from $dir"
          if ($env:FORCE_VERSION) { Write-Host "Forcing version: $env:FORCE_VERSION" }

      - name: Install AU module to PSModulePath
        run: |
          & "$env:GITHUB_WORKSPACE\install.ps1" -module_path "$env:GITHUB_WORKSPACE\AU"

      - name: Run AU update.ps1 (refresh embedded binary from vendor)
        if: ${{ inputs.run_au }}
        working-directory: automatic/${{ inputs.package }}
        run: |
          if ($env:FORCE_VERSION) {
            $global:au_Version = $env:FORCE_VERSION
            Write-Host "Forcing au_Version: $global:au_Version"
          }
          ./update.ps1

      - name: Pack
        working-directory: automatic/${{ inputs.package }}
        run: |
          [xml]$nuspec = Get-Content "$env:PACKAGE.nuspec"
          $version = $nuspec.package.metadata.version
          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=$env:PACKAGE/$version" >> $env:GITHUB_ENV
          "LATEST_TAG=$env:PACKAGE/latest" >> $env:GITHUB_ENV
          Write-Host "Version: $version"
          choco pack --out $env:RUNNER_TEMP
          Get-ChildItem $env:RUNNER_TEMP\*.nupkg | ForEach-Object {
            Write-Host "Built: $($_.Name) ($([math]::Round($_.Length/1MB,2)) MB)"
          }

      - name: Install package from local source
        if: ${{ !inputs.skip_install_test }}
        run: |
          choco install $env:PACKAGE `
            --source "$env:RUNNER_TEMP;https://community.chocolatey.org/api/v2/" `
            --confirm --no-progress

      - name: Verify install via chocolatey local list
        if: ${{ !inputs.skip_install_test }}
        run: |
          $listing = choco list $env:PACKAGE --exact 2>&1 | Out-String
          if ($listing -notmatch "(?m)^$([regex]::Escape($env:PACKAGE))\s") {
            Write-Host "choco list output:`n$listing"
            throw "$env:PACKAGE not in chocolatey local list after install"
          }
          Write-Host "Confirmed installed via chocolatey:"
          Write-Host $listing

      - name: Uninstall
        if: ${{ !inputs.skip_install_test }}
        run: choco uninstall $env:PACKAGE --confirm --no-progress

      - name: Create or update GitHub Release
        if: ${{ inputs.publish_release && success() }}
        env:
          REPO: ${{ github.repository }}
        run: |
          $nupkg = (Get-ChildItem $env:RUNNER_TEMP\*.nupkg | Select-Object -First 1).FullName
          $tag   = $env:RELEASE_TAG
          $title = "$env:PACKAGE $env:PACKAGE_VERSION"

          # Build release notes as a file (avoids YAML block-scalar / here-string
          # indent collisions).
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $fence = '```'
          $nupkgUrl = "https://github.com/$($env:REPO)/releases/download/$tag/$($env:PACKAGE).$($env:PACKAGE_VERSION).nupkg"
          $lines = @()
          $lines += "Chocolatey package: **$($env:PACKAGE) $($env:PACKAGE_VERSION)**"
          $lines += ""
          $lines += "Distributed via this repository's GitHub Releases (not community.chocolatey.org). The vendor's Windows installer is embedded inside the .nupkg."
          $lines += ""
          $lines += "### Install (PowerShell)"
          $lines += ""
          $lines += "Chocolatey's ``--source`` only accepts NuGet OData feeds or filesystem paths — it does not fetch arbitrary ``.nupkg`` URLs directly. Download the ``.nupkg`` first, then install from the containing folder:"
          $lines += ""
          $lines += $fence + "powershell"
          $lines += "Invoke-WebRequest '$nupkgUrl' -OutFile '$($env:PACKAGE).$($env:PACKAGE_VERSION).nupkg'"
          $lines += "choco install $($env:PACKAGE) --source `".`" --version $($env:PACKAGE_VERSION)"
          $lines += $fence
          $lines += ""
          $lines += "### Uninstall"
          $lines += ""
          $lines += $fence
          $lines += "choco uninstall $($env:PACKAGE)"
          $lines += $fence
          $lines += ""
          $lines += "The install script uses ``Get-UninstallRegistryKey`` to skip if the same product is already installed system-wide; pass ``--force`` to override."
          $lines += ""
          $lines += "See ``tools/VERIFICATION.txt`` inside the .nupkg for the SHA256 of the embedded binary and reproduction steps."
          $lines | Set-Content -Path $notesFile -Encoding UTF8

          # Idempotent: if the pinned-version release exists, update its notes
          # and upload the .nupkg with --clobber; otherwise create it fresh.
          gh release view $tag 1>$null 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists — updating notes + asset"
            gh release edit $tag --title $title --notes-file $notesFile
            gh release upload $tag $nupkg --clobber
          } else {
            Write-Host "Creating release $tag"
            gh release create $tag $nupkg --title $title --notes-file $notesFile
          }

          # Rolling `<package>/latest` release that always points at the newest
          # version. Delete-and-recreate is the cleanest way to move both the
          # release AND the underlying git tag onto the current commit.
          $latestTag   = $env:LATEST_TAG
          $latestTitle = "$($env:PACKAGE) (latest)"
          $latestNotesFile = Join-Path $env:RUNNER_TEMP 'release-notes-latest.md'
          $latestNupkgUrl = "https://github.com/$($env:REPO)/releases/download/$latestTag/$($env:PACKAGE).$($env:PACKAGE_VERSION).nupkg"
          $latestLines = @()
          $latestLines += "Rolling tag — always points at the latest **$($env:PACKAGE)** release."
          $latestLines += ""
          $latestLines += "Current version: **$($env:PACKAGE_VERSION)** (see the pinned release [$($env:PACKAGE) $($env:PACKAGE_VERSION)](https://github.com/$($env:REPO)/releases/tag/$tag))."
          $latestLines += ""
          $latestLines += "### Install (always-latest, PowerShell)"
          $latestLines += ""
          $latestLines += "Chocolatey's ``--source`` only accepts NuGet OData feeds or filesystem paths — it does not fetch arbitrary ``.nupkg`` URLs directly. Download the ``.nupkg`` first, then install from the containing folder:"
          $latestLines += ""
          $latestLines += $fence + "powershell"
          $latestLines += "Invoke-WebRequest '$latestNupkgUrl' -OutFile '$($env:PACKAGE).nupkg'"
          $latestLines += "choco install $($env:PACKAGE) --source `".`""
          $latestLines += $fence
          $latestLines += ""
          $latestLines += "The install script uses ``Get-UninstallRegistryKey`` to skip if the same product is already installed system-wide; pass ``--force`` to override."
          $latestLines += ""
          $latestLines += "See ``tools/VERIFICATION.txt`` inside the .nupkg for the SHA256 of the embedded binary and reproduction steps."
          $latestLines | Set-Content -Path $latestNotesFile -Encoding UTF8

          Write-Host "Refreshing rolling release $latestTag -> $($env:PACKAGE_VERSION)"
          gh release delete $latestTag --yes --cleanup-tag 2>$null
          gh release create $latestTag $nupkg --title $latestTitle --notes-file $latestNotesFile

      # ---------------------------------------------------------------------
      # Static NuGet v3 feed on the orphan `gh-pages` branch, served by
      # GitHub Pages. See docs/nuget-feed-design.md for the "why".
      # ---------------------------------------------------------------------
      - name: Publish to static NuGet feed on gh-pages
        if: ${{ inputs.publish_release && success() }}
        env:
          REPO: ${{ github.repository }}
          FEED_BASE_URI: https://mkopnsrc.github.io/chocolatey-packages/nuget/
          RETENTION_STABLE: '5'
          RETENTION_PRERELEASE: '0'
        run: |
          $nupkg = (Get-ChildItem $env:RUNNER_TEMP\*.nupkg | Select-Object -First 1).FullName

          # Install sleet as a global .NET tool. Windows-2022 has multiple
          # .NET SDKs preinstalled; the latest LTS is fine for sleet.
          dotnet tool install -g sleet
          if ($LASTEXITCODE -ne 0) { throw "dotnet tool install sleet failed" }
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"

          # Clone the gh-pages branch into a sibling worktree. If it doesn't
          # exist yet (first ever publish), create it as an orphan branch.
          $feedRepo = Join-Path $env:RUNNER_TEMP 'feed-repo'
          $repoUrl  = "https://x-access-token:$env:GH_TOKEN@github.com/$env:REPO.git"

          $bootstrapped = $false
          $remoteHead = git ls-remote --heads $repoUrl gh-pages
          if ($LASTEXITCODE -ne 0) { throw "git ls-remote gh-pages failed" }
          if ($remoteHead) {
            Write-Host "gh-pages branch exists — cloning"
            git clone --branch gh-pages --single-branch --depth 1 $repoUrl $feedRepo
            if ($LASTEXITCODE -ne 0) { throw "git clone of gh-pages failed" }
          } else {
            Write-Host "gh-pages branch does not exist — bootstrapping as orphan"
            New-Item -ItemType Directory -Path $feedRepo -Force | Out-Null
            Push-Location $feedRepo
            git init -b gh-pages
            git remote add origin $repoUrl
            Pop-Location
            $bootstrapped = $true
          }

          Set-Location $feedRepo
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name  'github-actions[bot]'

          # Build sleet.json inline (path is runner-specific, baseURI is fixed).
          $feedPath = Join-Path $feedRepo 'nuget'
          $sleetConfig = Join-Path $env:RUNNER_TEMP 'sleet.json'
          $sleetJson = @{
            username = ''
            useremail = ''
            sources = @(@{
              name    = 'feed'
              type    = 'local'
              path    = $feedPath
              baseURI = $env:FEED_BASE_URI
            })
          } | ConvertTo-Json -Depth 4
          Set-Content -Path $sleetConfig -Value $sleetJson -Encoding UTF8

          # If the feed dir has no sleet.settings.json, initialize a fresh feed.
          $sleetSettings = Join-Path $feedPath 'sleet.settings.json'
          if (-not (Test-Path $sleetSettings)) {
            New-Item -ItemType Directory -Path $feedPath -Force | Out-Null
            sleet init --config $sleetConfig
            if ($LASTEXITCODE -ne 0) { throw "sleet init failed" }
          }

          # Add the new .nupkg. --skip-existing makes re-dispatches idempotent.
          sleet push $nupkg --config $sleetConfig --skip-existing
          if ($LASTEXITCODE -ne 0) { throw "sleet push failed" }

          # Enforce retention inline instead of via `sleet retention settings`,
          # which was failing with a swallowed error on init runs. The docs
          # explicitly support passing --stable/--prerelease directly to prune.
          sleet retention prune --stable $env:RETENTION_STABLE --prerelease $env:RETENTION_PRERELEASE --config $sleetConfig
          if ($LASTEXITCODE -ne 0) { throw "sleet retention prune failed" }

          # Landing page so someone visiting the repo's GH Pages URL sees
          # something useful instead of a 404. (Built as an array of lines
          # to keep every YAML row at the same block-scalar indent — HTML
          # in a PowerShell here-string breaks out of `run: |` otherwise.)
          $indexHtml = Join-Path $feedRepo 'index.html'
          if (-not (Test-Path $indexHtml)) {
            $html = @()
            $html += '<!doctype html><meta charset="utf-8">'
            $html += '<title>chocolatey-packages NuGet feed</title>'
            $html += '<h1>chocolatey-packages NuGet feed</h1>'
            $html += '<p>Static NuGet v3 feed for embedded-binary Chocolatey packages published from'
            $html += '<a href="https://github.com/mkopnsrc/chocolatey-packages">mkopnsrc/chocolatey-packages</a>.</p>'
            $html += '<pre>'
            $html += 'choco source add -n mkopnsrc -s https://mkopnsrc.github.io/chocolatey-packages/nuget/index.json'
            $html += 'choco install fluent-bit -s mkopnsrc'
            $html += '</pre>'
            $html += '<p>See the repo README for the full package list and the download-from-Releases alternative.</p>'
            $html | Set-Content -Path $indexHtml -Encoding UTF8
          }

          # Commit + push. If bootstrapping, this is the first commit.
          git add -A
          if (git diff --cached --quiet) {
            Write-Host "No feed changes to commit (probably a re-dispatch of the same version)."
          } else {
            $msg = "publish: $($env:PACKAGE) $($env:PACKAGE_VERSION)"
            if ($bootstrapped) { $msg = "bootstrap: initial gh-pages feed + $msg" }
            git commit -m $msg
            if ($LASTEXITCODE -ne 0) { throw "git commit failed" }
            git push origin gh-pages
            if ($LASTEXITCODE -ne 0) { throw "git push gh-pages failed" }
            Write-Host "Feed updated: $env:FEED_BASE_URI"
          }

      - name: Upload nupkg artifact
        if: always() && env.PACKAGE_VERSION != ''
        uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.package }}-${{ env.PACKAGE_VERSION }}-nupkg
          path: ${{ runner.temp }}/*.nupkg
          retention-days: 14
